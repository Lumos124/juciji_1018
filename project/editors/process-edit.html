<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#17130e">
    <link rel="icon" href="data:,">
    <title>锔瓷记 · 流程条组件调节</title>
    <link rel="stylesheet" href="process-edit.css">
</head>
<body>
    <header class="editor-header">
        <div>
            <p class="eyebrow">PROCESS BAR</p>
            <h1>流程条组件调节</h1>
        </div>
        <div class="header-actions">
            <button id="save-btn" class="primary-btn" type="button">保存并应用</button>
            <button id="reset-btn" class="quiet-btn" type="button">恢复默认</button>
        </div>
    </header>

    <main class="editor-layout">
        <section class="stage-panel">
            <div class="stage-heading">
                <span>浅色工艺流程条定位参考</span>
                <strong id="selection-label">图标 1</strong>
            </div>
            <div class="stage-wrap">
                <div id="editor-stage" class="editor-stage">
                    <img class="stage-reference" src="/image/流程条/浅色工艺流程条.webp" alt="">
                    <img class="edit-icon" data-layout-key="icon-0" src="/image/流程条/锔瓷缘起.webp" alt="">
                    <img class="edit-icon" data-layout-key="icon-1" src="/image/流程条/名瓷鉴定.webp" alt="">
                    <img class="edit-icon" data-layout-key="icon-2" src="/image/流程条/瓷片清洗.webp" alt="">
                    <img class="edit-icon" data-layout-key="icon-3" src="/image/流程条/找碴对缝.webp" alt="">
                    <img class="edit-icon" data-layout-key="icon-4" src="/image/流程条/绑扎定型.webp" alt="">
                    <img class="edit-icon" data-layout-key="icon-5" src="/image/流程条/·上钉加固·.png" alt="">
                    <span class="edit-line" data-layout-key="line-0"></span>
                    <span class="edit-line" data-layout-key="line-1"></span>
                    <span class="edit-line" data-layout-key="line-2"></span>
                    <span class="edit-line" data-layout-key="line-3"></span>
                    <span class="edit-line" data-layout-key="line-4"></span>
                </div>
            </div>
        </section>

        <aside class="control-panel">
            <section class="control-section">
                <div class="section-title">
                    <h2>组件</h2>
                    <span id="save-state">未修改</span>
                </div>
                <label class="field">
                    <span>当前组件</span>
                    <select id="item-select"></select>
                </label>
                <div class="field-grid">
                    <label class="field">
                        <span>X 位置 %</span>
                        <input id="left-input" type="number" step="0.01">
                    </label>
                    <label class="field">
                        <span>Y 中心 %</span>
                        <input id="top-input" type="number" step="0.01">
                    </label>
                    <label class="field field-wide">
                        <span>宽度 %</span>
                        <input id="width-input" type="number" step="0.01" min="0.2" max="40">
                    </label>
                </div>
            </section>

            <section class="control-section">
                <div class="section-title">
                    <h2>导出</h2>
                    <button id="copy-btn" class="small-btn" type="button">复制配置</button>
                </div>
                <textarea id="layout-output" readonly spellcheck="false"></textarea>
            </section>
        </aside>
    </main>

    <script src="process-layout.js"></script>
    <script src="process-edit.js"></script>
</body>
</html>
