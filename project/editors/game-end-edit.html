<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#17130e">
    <link rel="icon" href="data:,">
    <title>锔瓷记 · 结束游戏键布局</title>
    <link rel="stylesheet" href="game-end-edit.css">
</head>
<body>
    <header class="editor-header">
        <div>
            <p class="eyebrow">GAME END BUTTON</p>
            <h1>结束游戏键布局</h1>
        </div>
        <div class="header-actions">
            <button id="save-btn" class="primary-btn" type="button">保存并应用</button>
            <button id="reset-btn" class="quiet-btn" type="button">恢复默认</button>
        </div>
    </header>

    <main class="editor-layout">
        <section class="stage-panel">
            <div class="stage-heading">
                <span>四个游戏共用同一位置和尺寸</span>
                <strong>右下角结束游戏键</strong>
            </div>
            <div class="stage-wrap">
                <div id="editor-stage" class="editor-stage">
                    <img class="editor-bg" src="/image/游戏/上钉/image/工作台背景.webp" alt="">
                    <button id="end-preview" type="button" aria-label="结束游戏">
                        <img src="/image/结束游戏键.png" alt="">
                    </button>
                </div>
            </div>
        </section>

        <aside class="control-panel">
            <section class="control-section">
                <div class="section-title">
                    <h2>位置与大小</h2>
                    <span id="save-state">未修改</span>
                </div>
                <div class="field-grid">
                    <label class="field">
                        <span>距右边 %</span>
                        <input id="right-input" type="number" step="0.01" min="-20" max="80">
                    </label>
                    <label class="field">
                        <span>距底部 %</span>
                        <input id="bottom-input" type="number" step="0.01" min="-20" max="80">
                    </label>
                    <label class="field field-wide">
                        <span>宽度 vw</span>
                        <input id="width-input" type="number" step="0.01" min="2" max="40">
                    </label>
                </div>
            </section>

            <section class="control-section">
                <div class="section-title">
                    <h2>导出</h2>
                    <button id="copy-btn" class="small-btn" type="button">复制配置</button>
                </div>
                <textarea id="layout-output" readonly spellcheck="false"></textarea>
            </section>
        </aside>
    </main>

    <script src="game-end-layout.js"></script>
    <script src="game-end-edit.js"></script>
</body>
</html>
