<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#12100c">
    <link rel="icon" href="data:,">
    <title>焗瓷记 · 找碴对缝</title>
    <style>
        :root {
            --ink: #12100c;
            --panel: rgba(26, 22, 17, 0.9);
            --parchment: #e9dcc0;
            --gold: #c9a45c;
            --gold-bright: #e6c886;
            --cinnabar: #b04a2f;
            --text: #f2ead9;
            --muted: rgba(242, 234, 217, 0.66);
            --line: rgba(233, 220, 192, 0.24);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            background: #000;
            color: var(--text);
            font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        html {
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        button {
            font-family: inherit;
            font-size: inherit;
            touch-action: manipulation;
        }

        .hidden {
            display: none !important;
        }

        /* 统一“固定比例舞台”：1em = 舞台宽度的 1%。
           电脑与平板无论什么分辨率，组件都按舞台百分比定位，所见完全一致。 */
        .stage {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            overflow: hidden;
            background: #000;
        }

        /* 开场（Frame 153.jpg 为 6710x3774，16:9） */
        .intro-stage {
            width: min(100vw, calc(100vh * 1.7784));
            aspect-ratio: 6710 / 3774;
            font-size: calc(min(100vw, 100vh * 1.7784) / 100);
            animation: fadeIn 0.9s ease;
        }

        /* 置顶框架 Frame 153.webp（中间透明，覆盖在视频上方） */
        .intro-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            z-index: 3;
            pointer-events: none;
            transform-origin: center;
            animation: introFrameGrow 2s ease-out forwards;
        }

        /* 外边框从小到大生长（参考 check.html 开场缩放节奏） */
        @keyframes introFrameGrow {
            from { transform: scale(0.98); }
            to { transform: scale(1); }
        }

        /* 中间循环播放开场背景视频 /image/背景.mp4 */
        .intro-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            z-index: 1;
        }

        /* 右侧四个游戏组件：当前组件稍大并缓慢右滑进入、可点击；其余不可跳转 */
        .intro-components {
            position: absolute;
            right: 6%;
            top: 8%;
            width: 29%;
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: -4em;
            align-items: flex-end;
        }

        .intro-component {
            width: 86%;
            transform: translateX(0);
            filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.4));
            -webkit-tap-highlight-color: transparent;
        }

        .intro-component.active {
            width: 100%;
            filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.4))
                    drop-shadow(0 0 18px rgba(230, 200, 134, 0.85))
                    drop-shadow(0 0 6px rgba(255, 220, 140, 0.6));
            transform: translateX(120%);
            opacity: 0;
            animation: compSlideIn 1.6s cubic-bezier(0.2, 0.8, 0.25, 1) 0.5s forwards;
        }

        .intro-comp-btn {
            width: 100%;
            padding: 0;
            background: none;
            border: none;
            cursor: pointer;
            display: block;
            transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .intro-comp-btn img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
        }

        /* 鼠标悬停：组件稍放大，并在四周显示光圈 */
        .intro-comp-btn:hover,
        .intro-comp-btn:focus-visible {
            outline: none;
            transform: scale(1.08);
            filter: drop-shadow(0 0 10px rgba(230, 200, 134, 0.55))
                    drop-shadow(0 0 3px rgba(255, 220, 140, 0.35));
        }

        .intro-comp-btn:active {
            transform: scale(0.97);
        }

        @keyframes compSlideIn {
            from {
                transform: translateX(120%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* 游戏舞台（Frame 64 为 6710x3774，16:9） */
        .game-stage {
            width: min(100vw, calc(100vh * 1.7784));
            aspect-ratio: 6710 / 3774;
            font-size: calc(min(100vw, 100vh * 1.7784) / 100);
        }

        .align-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }

        /* 晃动平板后淡入的第二背景（背景.webp），不带任何说明水印 */
        .align-bg2 {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            opacity: 0;
            transition: opacity 0.7s ease;
            pointer-events: none;
        }

        /* 置顶外边框 Frame 153.webp（中间透明，静置于场景上方，参考目录页） */
        .align-frame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            z-index: 3;
            pointer-events: none;
        }

        /* 碗底光圈（Group 141）：随开场由小变大 */
        .align-ring {
            position: absolute;
            left: 50%;
            top: 42%;
            transform: translate(-50%, -50%);
            width: 70%;
            aspect-ratio: 4815 / 4818;
            z-index: 1;
            opacity: 0;
            pointer-events: none;
            object-fit: contain;
            filter: drop-shadow(0 0 42px rgba(255, 222, 156, 0.4));
        }

        .align-ring.on {
            animation: ringIn 1.1s ease-out forwards;
        }

        @keyframes ringIn {
            from {
                transform: translate(-50%, -50%) scale(0.35);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        /* 每拼好一个瓷碗：底部光圈缓慢由小到大（参考开场，柔和单次渐明，不快速闪两下） */
        .align-ring.celebrate {
            animation: ringCelebrate 2.4s ease-out forwards;
        }

        @keyframes ringCelebrate {
            0% {
                transform: translate(-50%, -50%) scale(0.4);
                opacity: 0;
            }
            45% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            70% {
                transform: translate(-50%, -50%) scale(1.03);
                opacity: 0.55;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.06);
                opacity: 0.85;
            }
        }

        /* 左侧交互提示圆2：缓慢淡入后 2.4s 闪烁（与名瓷鉴定一致） */
        .align-hint2 {
            position: absolute;
            left: 26%;
            top: 55%;
            transform: translate(-50%, -50%);
            z-index: 9;
            width: clamp(58px, 9vw, 104px);
            aspect-ratio: 622 / 815;
            padding: 0;
            background: none;
            border: none;
            cursor: pointer;
            animation: hint2In 1s ease-out 0.2s backwards, hint2Blink 2.4s ease-in-out 1.2s infinite;
            -webkit-tap-highlight-color: transparent;
        }

        .align-hint2 img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
            filter: drop-shadow(0 8px 22px rgba(0, 0, 0, 0.5));
        }

        .align-hint2:hover {
            transform: translate(-50%, -50%) scale(1.06);
        }

        .align-hint2:active {
            transform: translate(-50%, -50%) scale(0.94);
        }

        @keyframes hint2In {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.7);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        @keyframes hint2Blink {
            0%,
            100% {
                opacity: 0.35;
                transform: translate(-50%, -50%) scale(0.96);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .align-hint-img {
            position: absolute;
            left: 50%;
            top: 70%;
            transform: translateX(-50%);
            width: 36%;
            z-index: 4;
            pointer-events: none;
            filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.42));
        }

        .align-hint-img.hidden {
            display: none;
        }

        .align-hint-img.slide-in {
            animation: hintSlideIn 0.75s cubic-bezier(0.2, 0.8, 0.25, 1) forwards;
        }

        @keyframes hintSlideIn {
            from {
                transform: translateX(-150%) translateY(0);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        .align-center {
            position: absolute;
            left: 50%;
            top: 42%;
            transform: translate(-50%, -50%);
            width: 69%;
            height: 78%;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 说明文字淡入阶段：先不显示中央瓷器 */
        .align-center.idle {
            opacity: 0;
            visibility: hidden;
        }

        .align-bowl {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 18px 26px rgba(0, 0, 0, 0.42));
        }

        .align-bowl.snap {
            animation: bowlSnap 0.55s cubic-bezier(0.2, 0.8, 0.25, 1);
        }

        .align-bowl.finish {
            animation: bowlFinish 0.7s ease-out;
        }

        /* 完成动画 webp（动1~动4）：尺寸/位置由每集参数控制（见 finishWebp 的 scale/offX/offY），不再统一放大 */
        .align-bowl.webp {
            max-width: 100%;
            max-height: 100%;
            transform-origin: center;
        }

        /* 拼合成功第一步：先出现 appear 瓷碗（瓷组2/5/8/11） */
        .align-bowl.appear-anim {
            animation: bowlAppear 1.1s ease-out forwards;
        }

        @keyframes bowlAppear {
            from {
                opacity: 0;
                filter: brightness(1.45) drop-shadow(0 0 30px rgba(230, 200, 134, 0.9));
            }
            to {
                opacity: 1;
                filter: drop-shadow(0 18px 26px rgba(0, 0, 0, 0.42));
            }
        }

        /* 拼合成功第二步：渐显 final 瓷碗（瓷组3/6/9/12） */
        .align-bowl.fade-in {
            animation: bowlFadeIn 1.6s ease forwards;
        }

        @keyframes bowlFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 开场：瓷组1 旋转由小变大 */
        .align-bowl.entrance {
            animation: bowlEntrance 0.95s cubic-bezier(0.2, 0.8, 0.25, 1) forwards;
        }

        @keyframes bowlEntrance {
            0% {
                transform: rotate(-14deg) scale(0.25);
                opacity: 0;
            }
            60% {
                transform: rotate(7deg) scale(1.08);
                opacity: 1;
            }
            100% {
                transform: rotate(0deg) scale(1);
                opacity: 1;
            }
        }

        /* 出现后：整组（碗）上下小幅来回移动 */
        .align-center.bob {
            animation: centerBob 2.8s ease-in-out infinite;
        }

        @keyframes centerBob {
            0%,
            100% {
                transform: translate(-50%, -50%) translateY(0);
            }
            50% {
                transform: translate(-50%, -50%) translateY(-8px);
            }
        }

        .align-fragments {
            position: absolute;
            left: 50%;
            bottom: 3%;
            transform: translateX(-50%);
            width: 64%;
            z-index: 4;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 3.5%;
        }

        .align-fragments.frag-hidden {
            opacity: 0;
            pointer-events: none;
        }

        .align-fragments.appear .align-frag {
            animation: fragAppear 0.55s cubic-bezier(0.2, 0.8, 0.25, 1) backwards;
        }

        .align-fragments.appear .align-frag:nth-child(1) {
            animation-delay: 0.05s;
        }

        .align-fragments.appear .align-frag:nth-child(2) {
            animation-delay: 0.15s;
        }

        .align-fragments.appear .align-frag:nth-child(3) {
            animation-delay: 0.25s;
        }

        .align-fragments.appear .align-frag:nth-child(4) {
            animation-delay: 0.35s;
        }

        @keyframes fragAppear {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.85);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .align-frag {
            position: relative;
            width: 15.5%;
            aspect-ratio: 1 / 1.2;
            padding: 0;
            background: none;
            border: none;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.32s cubic-bezier(0.2, 0.8, 0.25, 1), opacity 0.3s ease, filter 0.3s ease;
            touch-action: none;
        }

        .align-frag img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
            filter: drop-shadow(0 7px 12px rgba(0, 0, 0, 0.45));
            transition: filter 0.3s ease;
        }

        .align-frag:hover,
        .align-frag:focus-visible {
            transform: translateY(-4px) scale(1.08);
            outline: none;
        }

        .align-frag:hover img,
        .align-frag:focus-visible img {
            filter: drop-shadow(0 10px 16px rgba(0, 0, 0, 0.55));
        }

        .align-frag.dragging {
            cursor: grabbing;
            z-index: 6;
            transition: none;
        }

        .align-frag.dragging img {
            filter: drop-shadow(0 16px 22px rgba(0, 0, 0, 0.6)) brightness(1.08);
        }

        .align-frag.flying {
            transition: transform 0.42s cubic-bezier(0.2, 0.8, 0.25, 1), opacity 0.35s ease;
            z-index: 6;
            pointer-events: none;
        }

        /* 拼对：当前位置直接淡出消失（不位移） */
        .align-frag.vanish {
            opacity: 0;
            transition: opacity 0.36s ease;
            pointer-events: none;
        }

        .align-frag.done {
            opacity: 0.28;
            cursor: default;
        }

        .align-frag.returning {
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.25, 1);
        }

        .align-frag.wrong {
            animation: alignShake 0.4s ease;
        }

        /* 底部玩法说明（文字图.png）：满宽贴底，先缓慢淡入，停顿后再出现提示圆与中央瓷器 */
        .align-desc {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100vw;
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            animation: alignDescIn 1.5s ease forwards;
        }

        .align-desc img {
            width: 100%;
            height: auto;
            display: block;
        }

        @keyframes alignDescIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 停顿 0.8s 后文字图淡出消失 */
        .align-desc.out {
            animation: alignDescOut 0.7s ease forwards;
        }

        @keyframes alignDescOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* 结算页（修复等级认证）：4300x1978，约 2.174:1 */
        .settle-stage {
            width: min(100vw, calc(100vh * 2.1739));
            aspect-ratio: 4300 / 1978;
            font-size: calc(min(100vw, 100vh * 2.1739) / 100);
            animation: settleStageIn 1.1s ease forwards;
            background: #000;
        }

        .settle-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }

        /* 图像2：从右侧滑入 */
        .settle-scene {
            position: absolute;
            left: 50.3%;
            top: 8.3%;
            width: 47.9%;
            z-index: 3;
            filter: drop-shadow(0 22px 28px rgba(0, 0, 0, 0.35));
            opacity: 0;
            transform: translateX(45%);
            animation: settleSlideRight 1.9s cubic-bezier(0.2, 0.8, 0.25, 1) 0.85s forwards;
            pointer-events: none;
        }

        /* 初级：弹动出现 */
        .settle-grade {
            position: absolute;
            left: 8.1%;
            top: 10.2%;
            width: 39.4%;
            z-index: 4;
            opacity: 0;
            transform: scale(0.3) translateY(18px);
            animation: settlePop 1.65s cubic-bezier(0.34, 1.45, 0.64, 1) 1.35s forwards;
            pointer-events: none;
        }

        .settle-grade img {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 0 26px rgba(255, 222, 156, 0.45));
        }

        /* 返回：从左侧滑入 */
        .settle-back {
            position: absolute;
            left: 6%;
            top: 75.1%;
            width: 41%;
            z-index: 4;
            padding: 0;
            border: none;
            background: none;
            cursor: pointer;
            opacity: 0;
            transform: translateX(-45%);
            animation: settleSlideLeft 1.7s cubic-bezier(0.2, 0.8, 0.25, 1) 1.95s forwards;
        }

        .settle-back img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.35));
        }

        .settle-back:hover img {
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.45)) brightness(1.05);
        }

        /* 小标2 + 分数：渐显 */
        .settle-labels {
            position: absolute;
            left: 6%;
            top: 64.5%;
            width: 40%;
            z-index: 4;
            opacity: 0;
            animation: settleFadeIn 1.5s ease 2.7s forwards;
            pointer-events: none;
        }

        .settle-labels-img {
            width: 100%;
            height: auto;
            display: block;
        }

        .settle-score {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            color: #f0a744;
            font-size: 2.1em;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.65), 0 0 16px rgba(240, 167, 68, 0.35);
            line-height: 1;
            opacity: 0;
            animation: settleFadeIn 1.4s ease 3s forwards;
            font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
            white-space: nowrap;
        }

        .settle-score-porc { left: 42.3%; }
        .settle-score-seam { left: 99.5%; }

        @keyframes settleStageIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes settleFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes settleSlideRight {
            from { opacity: 0; transform: translateX(45%); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes settleSlideLeft {
            from { opacity: 0; transform: translateX(-45%); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes settlePop {
            0% { opacity: 0; transform: scale(0.3) translateY(18px); }
            45% { opacity: 1; transform: scale(1.12) translateY(-6px); }
            70% { transform: scale(0.95) translateY(3px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* 轻提示 */
        .toast {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            padding: 1.3em 2.2em;
            border-radius: 6px;
            background: rgba(18, 16, 12, 0.92);
            border: 1px solid var(--gold);
            color: var(--gold-bright);
            font-size: 1.05em;
            letter-spacing: 0.2em;
            text-indent: 0.2em;
            text-align: center;
            pointer-events: none;
            animation: popIn 0.35s cubic-bezier(0.2, 0.8, 0.25, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes zoomIn {
            from { transform: scale(1.08); }
            to { transform: scale(1); }
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.88) translateY(18px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes hintFloat {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-7px); }
        }

        @keyframes bowlSnap {
            0% {
                transform: scale(1.14);
                opacity: 0.25;
                filter: drop-shadow(0 0 30px rgba(230, 200, 134, 0.9)) drop-shadow(0 18px 26px rgba(0, 0, 0, 0.42));
            }
            55% { transform: scale(0.96); opacity: 1; }
            100% {
                transform: scale(1);
                opacity: 1;
                filter: drop-shadow(0 18px 26px rgba(0, 0, 0, 0.42));
            }
        }

        @keyframes bowlFinish {
            0% {
                transform: scale(0.92);
                opacity: 0.35;
                filter: brightness(1.6) drop-shadow(0 18px 26px rgba(0, 0, 0, 0.42));
            }
            60% { transform: scale(1.04); opacity: 1; }
            100% {
                transform: scale(1);
                opacity: 1;
                filter: drop-shadow(0 18px 26px rgba(0, 0, 0, 0.42));
            }
        }

        @keyframes alignShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-7px); }
            40% { transform: translateX(7px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }

        /* 底部常驻提示组95：沿用原“拖动提示图”的位置（居中、top 70%、宽36%） */
        .align-group95 {
            position: absolute;
            left: 50%;
            top: 70%;
            transform: translateX(-50%);
            width: 36%;
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .align-group95.show {
            opacity: 1;
        }

        .align-group95 img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 右下角「退出」：随时结束本局，按已完成阶段直接进入结算 */
        .exit-btn {
            position: absolute;
            right: 3.2em;
            bottom: 2.6em;
            z-index: 12;
            padding: 0.75em 1.6em;
            font-size: 1.45em;
            letter-spacing: 0.22em;
            text-indent: 0.22em;
            color: var(--gold-bright);
            background: rgba(18, 16, 12, 0.62);
            border: 1px solid rgba(201, 164, 92, 0.62);
            border-radius: 999px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
        }

        .exit-btn:hover,
        .exit-btn:focus-visible {
            background: var(--gold);
            color: var(--ink);
            outline: none;
            transform: translateY(-1px);
        }

        .exit-btn:active {
            transform: translateY(0) scale(0.98);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>

    <!-- 底部玩法说明（文字图.png）：挂到 body 下，避免被舞台 transform 锚定，从而真正贴住屏幕左右下边 -->

    <script src="intro-audio.js"></script>

    <script src="stage-score.js"></script>
    <script src="settle-audio.js"></script>
    <script>
        (function () {
            'use strict';

            // 找碴对缝：Frame 153.jpg 开场 + Frame 64 场景，共四轮
            const ALIGN = {
                fixedHoldMs: 1000,
                rounds: [
                    { initial: '/image/游戏/images/瓷组1.webp', appear: '/image/游戏/images/瓷组2.webp', final: '/image/游戏/images/瓷组3.webp', answer: '/image/游戏/images/小片4.webp' },
                    { initial: '/image/游戏/images/瓷组4.webp', appear: '/image/游戏/images/瓷组5.webp', final: '/image/游戏/images/瓷组6.webp', answer: '/image/游戏/images/小片2.webp' },
                    { initial: '/image/游戏/images/瓷组7.webp', appear: '/image/游戏/images/瓷组8.webp', final: '/image/游戏/images/瓷组9.webp', answer: '/image/游戏/images/小片3.webp' },
                    { initial: '/image/游戏/images/瓷组10.webp', appear: '/image/游戏/images/瓷组11.webp', final: '/image/游戏/images/瓷组12.webp', answer: '/image/游戏/images/小片1.webp' }
                ],
                fragments: [
                    { name: '碎片一', file: '/image/游戏/images/小片4.webp' },
                    { name: '碎片二', file: '/image/游戏/images/小片2.webp' },
                    { name: '碎片三', file: '/image/游戏/images/小片3.webp' },
                    { name: '碎片四', file: '/image/游戏/images/小片1.webp' }
                ],
                // 每块碎片拼合完成后，用对应的动画 webp 替代静态完成图
                finishWebp: [
                    { src: '/image/游戏/images/动1.webp', ms: 7667, scale: 1.42, offX: 0.0, offY: 2.0 },
                    { src: '/image/游戏/images/动2.webp', ms: 9375, scale: 1.24, offX: 0.6, offY: 3.4 },
                    { src: '/image/游戏/images/动3.webp', ms: 7792, scale: 1.24, offX: 1.1, offY: 3.9 },
                    { src: '/image/游戏/images/动4.webp', ms: 2334, scale: 1.05, offX: -0.4, offY: 4.8 }
                ]
            };

            const $ = (id) => document.getElementById(id);
            const intro = $('intro');
            const game = $('game');
            const alignBowl = $('align-bowl');
            const alignBowlWrap = $('align-center');
            const alignFragmentsEl = $('align-fragments');
            const alignHintImg = $('align-hint-img');
            const alignBg = document.querySelector('.align-bg');
            const alignBg2 = $('align-bg2');
            const alignRing = $('align-ring');
            const alignHint2 = $('align-hint2');
            const alignDesc = $('align-desc');
            const alignGroup95 = $('align-group95');
            const toastEl = $('toast');
            const settlement = $('settlement');
            const settleScorePorc = $('settle-score-porc');
            const settleScoreSeam = $('settle-score-seam');
            const settleBack = $('settle-back');
            const exitBtn = $('exit-btn');

            let alignStartTime = 0;
            let alignIntroTimer = null;
            let gameCompleteReady = false;

            // 起始目录背景视频：/image/背景.mp4（服务器 /image/ 别名挂载）
            // 1) 无缝循环：不再「播完 → 停在最后一帧 4 秒 → 再重播」。
            // 2) 把播放速度锁死：浏览器原生 loop 在回到开头的一瞬间会把 playbackRate
            //    重置回 defaultPlaybackRate，于是越播越快；这里两个值一起设，
            //    并在每个媒体事件 + 定时器里纠正，任何情况下都保持 INTRO_RATE。
            // 3) 平板 / 微信里 autoplay 经常被拦截：poster 兜底 + 首次手势补播 +
            //    前几秒轮询补播，保证开场背景一定能看到。
            const introVideo = document.querySelector('.intro-video');
            if (introVideo) {
                const INTRO_RATE = 1;   // 播放速度：1 = 原速，0.5 = 慢一倍
                introVideo.muted = true;
                introVideo.setAttribute('muted', '');
                introVideo.loop = true;
                introVideo.defaultPlaybackRate = INTRO_RATE;
                introVideo.playbackRate = INTRO_RATE;
                try { introVideo.load(); } catch (err) { /* ignore */ }

                const lockRate = () => {
                    if (introVideo.playbackRate !== INTRO_RATE) {
                        console.warn('[intro-video] playbackRate 被改成 ' + introVideo.playbackRate + '，已锁回 ' + INTRO_RATE);
                        introVideo.playbackRate = INTRO_RATE;
                    }
                    if (introVideo.defaultPlaybackRate !== INTRO_RATE) {
                        introVideo.defaultPlaybackRate = INTRO_RATE;
                    }
                };
                ['loadedmetadata', 'play', 'playing', 'seeked', 'timeupdate', 'ratechange', 'ended']
                    .forEach((ev) => introVideo.addEventListener(ev, lockRate));
                setInterval(lockRate, 250);

                const playIntroVideo = () => {
                    lockRate();
                    if (!introVideo.paused) return;
                    const p = introVideo.play();
                    if (p && p.catch) p.catch(() => {});
                };
                if (introVideo.readyState >= 1) {
                    introVideo.currentTime = 0;
                    playIntroVideo();
                } else {
                    introVideo.addEventListener('loadedmetadata', playIntroVideo, { once: true });
                }
                ['loadeddata', 'canplay', 'canplaythrough'].forEach((ev) => {
                    introVideo.addEventListener(ev, playIntroVideo);
                });
                // 平板/微信：自动播放被拦截时，首次触摸或点击立即补播
                ['pointerdown', 'touchstart', 'click', 'keydown'].forEach((ev) => {
                    document.addEventListener(ev, playIntroVideo, true);
                });
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        introVideo.pause();
                    } else {
                        playIntroVideo();
                    }
                });
                // 兜底：开场前几秒每秒确认一次是否真的在播
                let introTries = 0;
                const introRetry = setInterval(() => {
                    introTries += 1;
                    playIntroVideo();
                    if (introTries >= 8 || !introVideo.paused) clearInterval(introRetry);
                }, 1000);
            }

            let alignRound = 0;
            let alignDone = 0;      // 已完成的拼合轮数（用于按阶段判分）
            let alignBusy = false;
            let alignTimer = null;
            let alignDrag = null;
            let alignDragCleanup = null;
            let toastTimer = null;
            let alignRevealed = false;

            // 开场序列：瓷组1 旋转放大入场并上下浮动 -> 底部光圈放大 -> 左侧交互提示圆2 缓慢出现。
            function playAlignIntro() {
                alignRevealed = false;
                startAlignRound(0, true);
                if (window.AlignAudio) window.AlignAudio.center();
                alignBowl.classList.remove('entrance');
                alignBowlWrap.classList.add('bob');
                alignBowlWrap.classList.remove('idle');
                void alignBowl.offsetWidth;
                alignBowl.classList.add('entrance');
                setTimeout(() => alignBowl.classList.remove('entrance'), 1000);

                alignRing.classList.remove('hidden');
                alignRing.classList.remove('on');
                void alignRing.offsetWidth;
                alignRing.classList.add('on');

                alignHint2.classList.remove('hidden');
            }

            // 点击左侧交互提示圆2：提示.png 左滑入场，四个碎片浮现，开始拖动拼合。
            function revealAlignPlay() {
                if (alignRevealed) return;
                alignRevealed = true;
                if (window.AlignAudio) window.AlignAudio.fragments();
                alignHint2.classList.add('hidden');
                alignDesc.classList.add('hidden');
                alignHintImg.classList.remove('hidden');
                alignHintImg.classList.add('slide-in');
                setTimeout(() => alignHintImg.classList.remove('slide-in'), 800);
                alignFragmentsEl.classList.remove('frag-hidden');
                alignFragmentsEl.classList.add('appear');
            }
            alignHint2.addEventListener('click', () => revealAlignPlay());

            function showToast(text) {
                toastEl.textContent = text;
                toastEl.classList.remove('hidden');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toastEl.classList.add('hidden'), 1800);
            }

            // 按需预取：只拉当前轮/下一轮的图与完成动画（整段全量预取要近 200MB）
            function preloadRound(i) {
                const r = ALIGN.rounds[i];
                if (!r) return;
                [r.initial, r.appear, r.final].forEach((src) => {
                    const im = new Image();
                    im.src = src;
                });
                const w = ALIGN.finishWebp[i];
                if (w) {
                    const im = new Image();
                    im.src = w.src;
                }
            }

            function buildAlignFragments() {
                const frag = document.createDocumentFragment();
                ALIGN.fragments.forEach((f, i) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'align-frag';
                    btn.dataset.index = String(i);
                    btn.title = f.name;
                    btn.setAttribute('aria-label', f.name);
                    const img = document.createElement('img');
                    img.src = f.file;
                    img.alt = f.name;
                    btn.appendChild(img);
                    btn.addEventListener('pointerdown', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        startAlignDrag(i, e);
                    });
                    frag.appendChild(btn);
                });
                alignFragmentsEl.appendChild(frag);
            }

            function startAlignRound(index, intro) {
                const round = ALIGN.rounds[index];
                if (!round) return;
                alignRound = index;
                alignBusy = false;
                preloadRound(index);
                preloadRound(index + 1);
                alignBowl.src = round.initial;
                alignBowl.classList.remove('snap', 'finish', 'webp', 'appear-anim', 'fade-in');
                alignBowl.style.transform = '';
                alignBowl.style.opacity = '';
                if (intro) {
                    // 开场阶段：先只显示瓷组1与光圈，等点击交互提示圆2后再出现提示与碎片。
                    alignHintImg.classList.add('hidden');
                    alignHintImg.classList.remove('slide-in');
                    alignFragmentsEl.classList.add('frag-hidden');
                    alignFragmentsEl.classList.remove('appear');
                    alignHint2.classList.add('hidden');
                } else {
                    alignHintImg.classList.remove('hidden');
                    alignGroup95.classList.remove('show');
                    alignFragmentsEl.classList.remove('frag-hidden');
                    alignFragmentsEl.classList.add('appear');
                }
                Array.prototype.forEach.call(alignFragmentsEl.children, (el) => {
                    el.classList.remove('wrong', 'done', 'dragging', 'flying', 'returning', 'vanish');
                    el.style.transform = '';
                    el.style.opacity = '';
                    el.disabled = false;
                });
            }

            function startAlignDrag(index, e) {
                if (alignBusy || alignDrag) return;
                const btn = alignFragmentsEl.children[index];
                if (!btn || btn.disabled) return;
                e.preventDefault();
                if (window.AlignAudio) window.AlignAudio.click();
                const rect = btn.getBoundingClientRect();
                alignDrag = {
                    index,
                    pointerId: e.pointerId,
                    startX: e.clientX,
                    startY: e.clientY,
                    homeX: rect.left + rect.width / 2,
                    homeY: rect.top + rect.height / 2,
                    moved: false
                };
                btn.classList.add('dragging');
                try {
                    btn.setPointerCapture(e.pointerId);
                } catch (err) {
                    // 部分浏览器/合成指针不支持时忽略，走 window 级监听
                }
                alignHintImg.classList.add('hidden');
                alignGroup95.classList.add('show');

                const onMove = (ev) => moveAlignDrag(ev);
                const onUp = (ev) => endAlignDrag(ev);
                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onUp);
                window.addEventListener('pointercancel', onUp);
                alignDragCleanup = () => {
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                    window.removeEventListener('pointercancel', onUp);
                };
            }

            function moveAlignDrag(e) {
                const d = alignDrag;
                if (!d) return;
                const btn = alignFragmentsEl.children[d.index];
                if (!btn) return;
                d.moved = true;
                const dx = e.clientX - d.startX;
                const dy = e.clientY - d.startY;
                btn.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(1.12)';
            }

            function endAlignDrag() {
                const d = alignDrag;
                if (!d) return;
                alignDrag = null;
                const btn = alignFragmentsEl.children[d.index];
                if (!btn) return;
                if (alignDragCleanup) {
                    alignDragCleanup();
                    alignDragCleanup = null;
                }
                btn.classList.remove('dragging');
                if (btn.disabled) return;

                const rect = btn.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const bowlRect = alignBowlWrap.getBoundingClientRect();
                const bowlCx = bowlRect.left + bowlRect.width / 2;
                const bowlCy = bowlRect.top + bowlRect.height / 2;
                const dist = Math.hypot(cx - bowlCx, cy - bowlCy);
                // 落点判定：以“碎片起点到碗心的距离”为基准，横屏/竖屏都能拖到碗。
                const homeDist = Math.hypot(d.homeX - bowlCx, d.homeY - bowlCy);
                const radius = homeDist * 0.48 + 40;

                if (d.moved && dist <= radius) {
                    resolveAlignDrop(d.index, btn);
                } else {
                    btn.classList.add('returning');
                    btn.style.transform = '';
                    setTimeout(() => {
                    btn.classList.remove('returning');
                        if (!alignBusy && !alignDrag) {
                            alignHintImg.classList.remove('hidden');
                            alignGroup95.classList.remove('show');
                        }
                    }, 420);
                }
            }

            function resolveAlignDrop(index, btn) {
                const round = ALIGN.rounds[alignRound];
                const correct = ALIGN.fragments[index].file === round.answer;

                if (!correct) {
                    btn.classList.remove('wrong');
                    void btn.offsetWidth;
                    btn.classList.add('wrong');
                    btn.classList.add('returning');
                    btn.style.transform = '';
                    setTimeout(() => {
                        btn.classList.remove('returning', 'wrong');
                        if (!alignBusy && !alignDrag) {
                            alignHintImg.classList.remove('hidden');
                            alignGroup95.classList.remove('show');
                        }
                    }, 520);
                    return;
                }

                alignBusy = true;
                alignDone += 1;   // 本轮的碎片已经拼对，计入完成阶段
                // 拖到正确位置后：就地淡出消失，不做任何位移/缩小
                btn.classList.remove('dragging');
                void btn.offsetWidth;
                btn.classList.add('vanish');
                Array.prototype.forEach.call(alignFragmentsEl.children, (b, i) => {
                    if (i !== index) {
                        b.classList.add('done');
                        b.disabled = true;
                    }
                });

                setTimeout(() => {
                    btn.disabled = true;
                    // 第一步：拼合成功，先出现 appear 瓷碗（瓷组2/5/8/11）
                    if (window.AlignAudio) window.AlignAudio.bigFragment();
                    setAlignBowl(round.appear, 'appear-anim');
                    celebrateRing();
                    alignTimer = setTimeout(() => {
                        // 第二步：渐显 final 瓷碗（瓷组3/6/9/12）
                        showBowlFadeIn(round.final);
                        alignTimer = setTimeout(() => {
                            // 第三步：播放 webp 动画跳到下一个瓷碗
                            playFinishWebp(alignRound).then(() => {
                                if (alignRound + 1 < ALIGN.rounds.length) {
                                    startAlignRound(alignRound + 1);
                                } else {
                                    markCompleteReady();
                                }
                            });
                        }, 1800);
                    }, 1300);
                }, 420);
            }

            function setAlignBowl(src, animClass) {
                alignBowl.classList.remove('snap', 'finish', 'webp', 'appear-anim', 'fade-in');
                alignBowl.src = src;
                void alignBowl.offsetWidth;
                alignBowl.classList.add(animClass);
            }

            // 渐显 final 瓷碗：先把透明度归零，避免换图瞬间闪现
            function showBowlFadeIn(src) {
                alignBowl.classList.remove('snap', 'finish', 'webp', 'appear-anim', 'fade-in');
                alignBowl.style.opacity = '0';
                alignBowl.src = src;
                void alignBowl.offsetWidth;
                alignBowl.classList.add('fade-in');
            }

            // 每拼好一个瓷碗：底部光圈由小到大、闪烁两下
            function celebrateRing() {
                alignRing.classList.remove('celebrate');
                void alignRing.offsetWidth;
                alignRing.classList.add('celebrate');
            }

            // 播放第 index 块碎片拼合完成的动画 webp，等图片加载完成后播满整轮时长再 resolve
            function playFinishWebp(index) {
                const fin = ALIGN.finishWebp[index] || null;
                const src = fin ? fin.src : ALIGN.rounds[index].final;
                const dur = (fin ? fin.ms : 1000) + 90;
                const scale = fin ? fin.scale : 1;
                const offX = fin ? fin.offX : 0;
                const offY = fin ? fin.offY : 0;
                alignBowl.classList.remove('snap', 'finish', 'webp', 'appear-anim', 'fade-in');
                alignBowl.style.opacity = '0';
                // 换图前先清掉缩放/位移：避免新 webp 还没加载完时，
                // 上一张静态瓷碗带着 webp 的 scale 被放大闪现一下。
                alignBowl.style.transform = '';
                alignBowl.classList.add('webp');
                alignBowl.src = src;
                return new Promise((resolve) => {
                    let started = false;
                    const go = () => {
                        if (started) return;
                        started = true;
                        // 等 webp 真正加载完成后再套用位移/缩放并渐显，全程无放大闪帧
                        alignBowl.style.transform = 'translate(' + offX + 'em, ' + offY + 'em) scale(' + scale + ')';
                        void alignBowl.offsetWidth;
                        alignBowl.classList.add('fade-in');
                        if (window.AlignAudio) window.AlignAudio.rotate();
                        alignTimer = setTimeout(() => resolve(), dur);
                    };
                    if (alignBowl.complete && alignBowl.naturalWidth > 0) {
                        go();
                    } else {
                        alignBowl.addEventListener('load', go, { once: true });
                        alignBowl.addEventListener('error', go, { once: true });
                    }
                });
            }

            function clearAlignTimer() {
                if (alignTimer !== null) {
                    clearTimeout(alignTimer);
                    alignTimer = null;
                }
            }

            // 按完成阶段判分：4 轮每轮 25 分，全部拼完给 99.9（不满分），
            // 中途点「退出」也能得到有差异的分数。
            function computeAlignScore() {
                const done = Math.min(alignDone, ALIGN.rounds.length);
                if (window.stageScore) return window.stageScore(done, ALIGN.rounds.length);
                return Math.min(99.9, Math.round(done * (100 / ALIGN.rounds.length) * 10) / 10);
            }

            function markCompleteReady() {
                if (gameCompleteReady) return;
                gameCompleteReady = true;
                if (exitBtn) {
                    exitBtn.classList.remove('hidden', 'ready');
                    void exitBtn.offsetWidth;
                    exitBtn.classList.add('ready');
                }
            }

            function showSettlement() {
                if (!settlement.classList.contains('hidden')) return;
                const score = computeAlignScore();
                const fmt = window.formatScore || String;
                const porc = localStorage.getItem('porcelain_score');
                settleScorePorc.textContent = porc != null && porc !== '' ? porc : '—';
                settleScoreSeam.textContent = fmt(score);
                localStorage.setItem('align_score', String(score));
                if (exitBtn) exitBtn.classList.add('hidden');
                if (exitBtn) exitBtn.classList.remove('ready');
                game.classList.add('hidden');
                alignDesc.classList.add('hidden');
                settlement.classList.remove('hidden');
                // 通知桌面端：本节点已经完成，后面的小游戏才解锁。
                // 一轮都没拼完就退出，不算通关，后面的小游戏仍然锁定。
                if (alignDone > 0) {
                    try {
                        fetch('/api/complete?node=n02_align&score=' + encodeURIComponent(score), { method: 'POST' }).catch(() => {});
                    } catch (err) {
                        /* 忽略旧服务进程不支持的接口 */
                    }
                }
            }

            function showGame() {
                // 进入正式游戏：停「游戏初始界面」BGM，起正式游戏 BGM。
                if (window.GameBgm) {
                    window.GameBgm.start();
                } else if (window.IntroAudio) {
                    window.IntroAudio.stopBgm();
                }
                intro.classList.add('hidden');
                game.classList.remove('hidden');
                alignStartTime = Date.now();
                if (!alignFragmentsEl.children.length) {
                    buildAlignFragments();
                }
                // 去掉“晃动平板”步骤：进入后直接切换到 背景.webp 并进入“点击提示圆”阶段。
                alignRevealed = false;
                alignBg.src = '/image/游戏/images/Frame 64.webp';
                alignBg2.style.opacity = '1';
                alignRing.classList.add('hidden');
                alignRing.classList.remove('on');
                alignHint2.classList.add('hidden');
                alignHintImg.classList.add('hidden');
                alignHintImg.classList.remove('slide-in');
                alignGroup95.classList.remove('show');
                alignBowlWrap.classList.remove('bob');
                alignBowl.classList.remove('entrance');
                alignBowlWrap.classList.add('idle');
                alignFragmentsEl.classList.add('frag-hidden');
                alignFragmentsEl.classList.remove('appear');
                alignDesc.classList.remove('hidden');
                if (window.AlignAudio) window.AlignAudio.screen();
                gameCompleteReady = false;
                if (exitBtn) exitBtn.classList.remove('hidden', 'ready');
                // 只预取前两轮；其余在轮到它时再拉
                preloadRound(0);
                preloadRound(1);
                ALIGN.fragments.forEach((f) => {
                    const im = new Image();
                    im.src = f.file;
                });
                const bg2 = new Image();
                bg2.src = '/image/游戏/images/背景.webp';
                // 文字图.png 缓慢淡入 -> 停顿 0.8s -> 文字图淡出消失 -> 再出现提示圆与中央瓷器
                clearTimeout(alignIntroTimer);
                alignIntroTimer = setTimeout(() => {
                    alignDesc.classList.add('out');
                    alignIntroTimer = setTimeout(() => {
                        alignDesc.classList.add('hidden');
                        playAlignIntro();
                    }, 700);
                }, 1500 + 800);
            }

            // 只有当前游戏（active）的组件可点击进入，其他组件点击不跳转
            document.querySelectorAll('.intro-comp-btn').forEach((btn) => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const wrap = btn.closest('.intro-component');
                    if (wrap && wrap.classList.contains('active')) {
                        if (window.AlignAudio) window.AlignAudio.uiClick();
                        showGame();
                    }
                });
            });
            // 结算页：返回按钮回到主页
            settleBack.addEventListener('click', () => {
                window.location.href = 'index.html';
            });

            // 右下角「退出」：直接跳到结算页，按已完成阶段判分
            if (exitBtn) {
                exitBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showSettlement();
                });
            }

        })();
    </script>
</body>
</html>
